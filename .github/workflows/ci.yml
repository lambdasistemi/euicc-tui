name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # the release planner runs CI on its release branch
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds every derivation once so the jobs below find them in the
  # shared store.
  build-gate:
    name: Build Gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build all derivations
        run: >-
          nix build --quiet --accept-flake-config
          .#default
          .#unit-tests
          .#checks.x86_64-linux.unit
          .#devShells.x86_64-linux.default
          .#linux-release-artifacts
      - name: Release version contract
        run: scripts/release/check-version-consistency

  build:
    name: CI build
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - name: Flake checks
        run: nix flake check --quiet --accept-flake-config
      - name: Unit tests
        run: nix run --quiet --accept-flake-config .#unit

  dev-shell:
    name: CI dev shell
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - name: Build and test inside nix develop
        run: >-
          nix develop --quiet --accept-flake-config
          -c bash -c 'cabal update && just build && just unit'

  formatting:
    name: CI format
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - name: Check formatting
        run: nix develop --quiet --accept-flake-config -c just format-check

  hlint:
    name: CI hlint
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - name: Run HLint
        run: nix develop --quiet --accept-flake-config -c just hlint

  linux-packages:
    name: CI Linux packages
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build Linux release artifacts
        id: build
        run: |
          out="$(nix build --quiet --accept-flake-config --print-out-paths .#linux-release-artifacts)"
          echo "out=$out" >>"$GITHUB_OUTPUT"
          echo "version=$(scripts/release/get-cabal-version)" >>"$GITHUB_OUTPUT"
      - name: Smoke the extracted .deb, .rpm and AppImage
        run: >-
          nix run --quiet --accept-flake-config .#linux-artifact-smoke --
          --artifacts-dir "${{ steps.build.outputs.out }}"
          --artifact-version "${{ steps.build.outputs.version }}"
      - name: Install on Ubuntu, Debian and Fedora
        run: >-
          nix run --quiet --accept-flake-config .#linux-install-test --
          --artifacts-dir "${{ steps.build.outputs.out }}"
          --artifact-version "${{ steps.build.outputs.version }}"
