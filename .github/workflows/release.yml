name: Linux Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "Release mode"
        required: true
        default: release
        type: choice
        options:
          - release
          - dev-linux
      tag:
        description: "Existing release tag, for example v0.1.1.0"
        required: false
        type: string
      publish:
        description: "Upload release assets when mode=release"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: write

concurrency:
  group: linux-release-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name || inputs.tag || inputs.mode }}
  cancel-in-progress: false

jobs:
  linux-bundles:
    name: Build Linux release bundles
    runs-on: nixos
    env:
      DEV_TAG: dev-linux
      MODE: ${{ github.event_name == 'pull_request' && 'dev-linux' || inputs.mode || 'release' }}
      PUBLISH: ${{ github.event_name == 'push' && 'yes' || inputs.publish || 'no' }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || github.ref }}

      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Validate release mode
        run: |
          set -euo pipefail
          case "$MODE" in
            release)
              if [ -z "${TAG:-}" ]; then
                echo "release mode requires a v* tag from a tag push or the tag input" >&2
                exit 1
              fi
              scripts/release/check-version-consistency "$TAG"
              ;;
            dev-linux)
              ;;
            *)
              echo "unsupported release mode: $MODE" >&2
              exit 1
              ;;
          esac

      - name: Build, smoke-test and install-test Linux artifacts
        id: linux-artifacts
        run: |
          set -euo pipefail

          case "$MODE" in
            release)
              artifact_version="$(scripts/release/get-cabal-version)"
              package_output="linux-release-artifacts"
              artifact_name="linux-release-bundles"
              ;;
            dev-linux)
              artifact_version="$(scripts/release/get-cabal-version)-$(git rev-parse --short=7 HEAD)"
              package_output="linux-dev-release-artifacts"
              artifact_name="linux-dev-release-bundles"
              ;;
          esac

          nix build --quiet --accept-flake-config ".#$package_output"
          artifact_dir="$(readlink -f result)"
          nix run --quiet --accept-flake-config .#linux-artifact-smoke -- \
            --artifacts-dir "$artifact_dir" \
            --artifact-version "$artifact_version"
          nix run --quiet --accept-flake-config .#linux-install-test -- \
            --artifacts-dir "$artifact_dir" \
            --artifact-version "$artifact_version"

          rm -rf artifacts
          mkdir -p artifacts
          cp -L "$artifact_dir"/* artifacts/
          ls -lh artifacts/

          {
            echo "artifact_name=$artifact_name"
            echo "artifact_version=$artifact_version"
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.linux-artifacts.outputs.artifact_name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Create release and upload artifacts
        if: env.MODE == 'release' && env.PUBLISH == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          {
            scripts/release/extract-notes "$TAG"
            echo
            echo "## Install"
            echo
            echo "Debian and Ubuntu (amd64): \`sudo apt install ./euicc-tui-${TAG#v}-x86_64-linux.deb\`"
            echo "installs pcscd, the CCID reader driver and the PC/SC client library."
            echo "lpac is bundled."
            echo
            echo "Fedora (x86_64): \`sudo dnf install ./euicc-tui-${TAG#v}-x86_64-linux.rpm\`"
            echo "installs pcsc-lite, pcsc-lite-ccid and pcsc-lite-libs; then enable pcscd.socket."
            echo
            echo "Other distributions: \`euicc-tui.AppImage\` (lpac bundled). Install pcscd and"
            echo "the CCID driver (ccid or libccid) from the distribution first. The AppImage needs"
            echo "unprivileged user namespaces, which Ubuntu 24.04 and later restrict: use the .deb there."
          } > "$notes"
          gh=(nix --quiet shell nixpkgs#gh -c gh)
          "${gh[@]}" release view "$TAG" >/dev/null 2>&1 \
            || "${gh[@]}" release create "$TAG" \
              --title "euicc-tui $TAG" \
              --notes-file "$notes" \
            || "${gh[@]}" release view "$TAG" >/dev/null
          "${gh[@]}" release upload "$TAG" artifacts/* --clobber

      - name: Publish dev Linux release assets
        if: env.MODE == 'dev-linux' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          {
            echo "Development Linux bundles for $GITHUB_SHA"
            echo
            echo "Built from $GITHUB_REF."
          } > "$notes"

          git tag -f "$DEV_TAG" HEAD
          git push --force origin "refs/tags/$DEV_TAG"

          gh=(nix --quiet shell nixpkgs#gh -c gh)
          "${gh[@]}" release view "$DEV_TAG" >/dev/null 2>&1 \
            || "${gh[@]}" release create "$DEV_TAG" \
              --title "euicc-tui dev Linux bundles" \
              --notes-file "$notes" \
              --prerelease
          "${gh[@]}" release edit "$DEV_TAG" \
            --title "euicc-tui dev Linux bundles" \
            --notes-file "$notes" \
            --prerelease
          "${gh[@]}" release upload "$DEV_TAG" artifacts/* --clobber
